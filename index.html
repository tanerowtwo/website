* {

html { scroll-behavior: smooth; }

body {

::selection {

a {

}

button {

}

a:focus-visible,
button:focus-visible {
  outline: 1px solid #e4e4e7;
  outline-offset: 4px;
}

/* ХЕДЕР */
.site-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 50;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  background-color: rgba(12,12,14,0.75);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
}

.header-container {
  max-width: 84rem;
  margin: 0 auto;
  padding: 0 1.5rem;
  height: 4rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo { line-height: 1.25; }

.logo-name {
  display: block;
  font-size: 0.875rem;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.logo-title {
  display: block;
  font-size: 10.5px;
  letter-spacing: 0.12em;
  color: #71717a;
  margin-top: 0.125rem;
}

.nav-menu {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  font-size: 0.875rem;
  color: #a1a1aa;
  position: relative;
}

.nav-menu .nav-link::after { display: none; }

.nav-indicator {
  position: absolute;
  bottom: -8px;
  left: 0;
  height: 1px;
  width: 0;
  background: #f4f4f5;
  opacity: 0;
  transition:
    left 0.3s cubic-bezier(0.4,0,0.2,1),
    width 0.3s cubic-bezier(0.4,0,0.2,1),
    opacity 0.2s ease;
  pointer-events: none;
}

.nav-link {
  position: relative;
  transition: color 0.2s ease;
}

.nav-link:hover { color: #f4f4f5; }

.nav-link::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -2px;
  width: 100%;
  height: 1px;
  background: currentColor;
  transform: scaleX(0);
  transform-origin: right;
  transition: transform 0.25s ease;
}

.nav-link:hover::after {
  transform: scaleX(1);
  transform-origin: left;
}

/* СЕКЦИЯ РАБОТ */
.works-section {
  max-width: 84rem;
  margin: 0 auto;
  padding: 5rem 1.5rem 1.5rem;
}

.tabs-container {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.75rem;
  font-size: 0.875rem;
  margin-bottom: 1.5rem;
}

.tabs-group {
  position: relative;
  display: flex;
  align-items: center;
  gap: 1.25rem;
}

.backup-link {
  color: #71717a;
  white-space: nowrap;
  font-size: 0.8125rem;
}

.tab-btn {
  position: relative;
  z-index: 1;
  padding: 0.5rem 0;
  transition: color 0.3s ease;
}

.tab-btn.active { color: #f4f4f5; }
.tab-btn.inactive { color: #71717a; }
.tab-btn.inactive:hover { color: #a1a1aa; }

/* СЕТКИ */
.grid-hidden { display: none !important; }

.grid-horizontal,
.grid-vertical {
  transition: opacity 0.12s ease;
  opacity: 1;
}

.grid-leaving { opacity: 0 !important; }
.grid-entering { opacity: 0 !important; }

.grid-horizontal {
  display: grid;
  grid-template-columns: 1fr;
  column-gap: 1.25rem;
  row-gap: 1.5rem;
}

.grid-vertical {
  display: grid;
  grid-template-columns: 1fr;
  column-gap: 0.875rem;
  row-gap: 1.25rem;
}

/* ФРЕЙМЫ ВИДЕО */
figure { display: block; }

.video-frame {
  position: relative;
  width: 100%;
  overflow: hidden;
  background: #18181b;
  border-radius: 0.5rem;
  cursor: pointer;
}

.video-frame .video-poster {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scale(1);
  transition: transform 1.1s cubic-bezier(0.22,1,0.36,1);
  will-change: transform;
}

.video-frame::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0);
  transition: background 0.8s ease;
  pointer-events: none;
}

.video-frame:not(.is-playing):hover .video-poster {
  transform: scale(1.025);
}

.video-frame:not(.is-playing):hover::after {
  background: rgba(0,0,0,0.25);
}

/* PLAY */
.video-play {
  position: absolute;
  z-index: 2;
  left: 50%;
  top: 50%;
  width: 52px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: translate(-50%,-50%) scale(0.82);
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.28));
  transition:
    opacity 0.45s ease,
    transform 0.65s cubic-bezier(0.22,1,0.36,1);
  pointer-events: none;
}

.video-play svg {
  width: 58px;
  height: 58px;
  fill: rgba(255,255,255,0.83);
}

.video-frame:hover .video-play {
  opacity: 1;
  transform: translate(-50%,-50%) scale(1);
}

.video-frame.is-playing { cursor: default; }

.video-frame.is-playing .video-poster,
.video-frame.is-playing .video-play {
  display: none;
}

.video-frame iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

.ratio-16-9 {
  position: relative;
  padding-top: 56.25%;
  width: 100%;
}

.ratio-9-16 {
  position: relative;
  padding-top: 177.78%;
  width: 100%;
}

.video-caption {
  margin-top: 0.75rem;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-size: 0.75rem;
  color: #71717a;
  letter-spacing: -0.025em;
  transition: color 0.5s ease;
}

.video-frame:hover + .video-caption {

}

/* ФУТЕР */

  .reveal {

    transform: none !important;

}

<script>
const tabHorizontal = document.getElementById('tab-horizontal');
const tabVertical = document.getElementById('tab-vertical');
const gridHorizontal = document.getElementById('grid-horizontal');
const gridVertical = document.getElementById('grid-vertical');
let isSwitching = false;

/* ПЕРЕКЛЮЧЕНИЕ СЕТКИ */
function switchGrid(showEl, hideEl) {
  if (isSwitching) return;
  isSwitching = true;

  hideEl.classList.add('grid-leaving');

  setTimeout(() => {
    hideEl.classList.add('grid-hidden');
    hideEl.classList.remove('grid-leaving');

    showEl.classList.remove('grid-hidden');
    showEl.classList.add('grid-entering');

    void showEl.offsetWidth;

    requestAnimationFrame(() => {
      showEl.classList.remove('grid-entering');
      isSwitching = false;
    });

    checkReveal();
  }, 120);
}

function showHorizontal() {
  if (tabHorizontal.classList.contains('active')) return;

  switchGrid(gridHorizontal, gridVertical);

  tabHorizontal.classList.add('active');
  tabHorizontal.classList.remove('inactive');
  tabVertical.classList.add('inactive');
  tabVertical.classList.remove('active');

  tabHorizontal.setAttribute('aria-pressed', 'true');
  tabVertical.setAttribute('aria-pressed', 'false');
}

function showVertical() {
  if (tabVertical.classList.contains('active')) return;

  switchGrid(gridVertical, gridHorizontal);

  tabVertical.classList.add('active');
  tabVertical.classList.remove('inactive');
  tabHorizontal.classList.add('inactive');
  tabHorizontal.classList.remove('active');

  tabVertical.setAttribute('aria-pressed', 'true');
  tabHorizontal.setAttribute('aria-pressed', 'false');
}

tabHorizontal.addEventListener('click', showHorizontal);
tabVertical.addEventListener('click', showVertical);

/* ПОДЧЁРКИВАНИЕ В ХЕДЕРЕ */
const navMenu = document.querySelector('.nav-menu');
const navIndicator = document.querySelector('.nav-indicator');
const navLinks = navMenu.querySelectorAll('.nav-link');

function moveIndicatorTo(el) {
  const menuRect = navMenu.getBoundingClientRect();
  const elRect = el.getBoundingClientRect();

  navIndicator.style.left = (elRect.left - menuRect.left) + 'px';
  navIndicator.style.width = elRect.width + 'px';
  navIndicator.style.opacity = '1';
}

navLinks.forEach(link => {
  link.addEventListener('mouseenter', () => moveIndicatorTo(link));
});

navMenu.addEventListener('mouseleave', () => {
  navIndicator.style.opacity = '0';
});

/* ПЛАВНЫЙ СКРОЛЛ */
document.querySelectorAll('[data-scroll-target]').forEach(link => {
  link.addEventListener('click', e => {
    e.preventDefault();

    const targetId = link.getAttribute('data-scroll-target');

    if (targetId === 'top') {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    } else {
      const target = document.getElementById(targetId);

      if (target) {
        target.scrollIntoView({
          behavior: 'smooth',
          block: 'start'
        });
      }
    }
  });
});

/* ПОЯВЛЕНИЕ КАРТОЧЕК */
const revealObserver = new IntersectionObserver(
  entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        revealObserver.unobserve(entry.target);
      }
    });
  },
  {
    threshold: 0.1,
    rootMargin: '0px 0px -20px 0px'
  }
);

function checkReveal() {
  document.querySelectorAll('.reveal').forEach((el, i) => {
    if (!el.classList.contains('is-visible')) {
      el.style.transitionDelay = `${(i % 4) * 0.05}s`;
      revealObserver.observe(el);
    }
  });
}

/* ВИДЕО — KINESCOPE ТОЛЬКО ПО КЛИКУ */
document.querySelectorAll('.video-frame[data-video-src]').forEach(frame => {
  const poster = frame.querySelector('.video-poster');
  const videoSrc = frame.dataset.videoSrc;

  function playVideo() {
    if (frame.classList.contains('is-playing')) return;

    const iframe = document.createElement('iframe');

    iframe.src = videoSrc + '?autoplay=1&no_poster=1';
    iframe.allow =
      'autoplay; fullscreen; picture-in-picture; encrypted-media; gyroscope; accelerometer; clipboard-write; screen-wake-lock;';
    iframe.setAttribute('allowfullscreen', '');
    iframe.setAttribute('frameborder', '0');
    iframe.title = 'Видео';
    iframe.loading = 'eager';

    frame.classList.add('is-playing');
    frame.appendChild(iframe);

    if (poster) poster.remove();
  }

  frame.addEventListener('click', playVideo);

  frame.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      playVideo();
    }
  });
});

/* ПЕРВАЯ ИНИЦИАЛИЗАЦИЯ */
checkReveal();
</script>
